  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2305070d' stroke='%2368f4d8' stroke-width='6'/%3E%3Ctext x='50' y='60' text-anchor='middle' fill='%23ffffff' font-family='Arial' font-size='36' font-weight='700'%3EJS%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(12, 16, 27, 0.76);
      --panel-2: rgba(15, 21, 35, 0.9);
      --text: #f7fbff;
      --muted: #96a2b7;
      --line: rgba(255,255,255,.09);
      --cyan: #68f4d8;
      --violet: #8e7dff;
      --pink: #ff6db5;
      --gold: #ffd479;
      --shadow: 0 30px 100px rgba(0,0,0,.45);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(104,244,216,.10), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(142,125,255,.12), transparent 24%),
        linear-gradient(180deg, #04060b 0%, #060912 55%, #05070d 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content:""; position:fixed; inset:0; z-index:-2; opacity:.17; pointer-events:none;
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    body::after {
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 20%), rgba(104,244,216,.10), transparent 20%);
      transition: background .15s linear;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width:100%; }
    .container { width:min(1180px, calc(100% - 40px)); margin:0 auto; }
    .nav { position:sticky; top:0; z-index:50; backdrop-filter: blur(16px); background:rgba(5,7,13,.72); border-bottom:1px solid rgba(255,255,255,.06); }
    .nav-inner { height:72px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:.02em; }
    .brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#091018; box-shadow:0 0 40px rgba(104,244,216,.22); font-size:13px; }
    .nav-links { display:flex; gap:22px; color:#aeb8ca; font-size:14px; }
    .nav-links a:hover { color:#fff; }
    .nav-cta { padding:10px 14px; border:1px solid rgba(104,244,216,.3); border-radius:999px; color:var(--cyan); background:rgba(104,244,216,.07); }

    .hero { padding:86px 0 56px; position:relative; }
    .hero-grid { display:grid; grid-template-columns:1.25fr .75fr; gap:44px; align-items:center; }
    .eyebrow { display:inline-flex; gap:10px; align-items:center; font-size:12px; text-transform:uppercase; letter-spacing:.16em; color:var(--cyan); padding:9px 12px; border:1px solid rgba(104,244,216,.2); border-radius:999px; background:rgba(104,244,216,.06); }
    .pulse { width:7px; height:7px; background:var(--cyan); border-radius:50%; box-shadow:0 0 0 0 rgba(104,244,216,.7); animation:pulse 1.8s infinite; }
    @keyframes pulse { 70%{box-shadow:0 0 0 10px rgba(104,244,216,0)} 100%{box-shadow:0 0 0 0 rgba(104,244,216,0)} }
    h1 { font-size:clamp(54px,8vw,98px); line-height:.95; letter-spacing:-.055em; margin:20px 0; max-width:860px; }
    .gradient { background:linear-gradient(90deg,#fff 10%,var(--cyan) 42%,#b6aefe 78%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hero-copy { max-width:760px; color:#a7b2c5; font-size:18px; line-height:1.72; }
    .hero-copy strong { color:#e8edf6; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .btn { display:inline-flex; align-items:center; gap:10px; padding:13px 18px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:#fff; font-weight:700; font-size:14px; transition:.25s ease; }
    .btn:hover { transform:translateY(-2px); border-color:rgba(104,244,216,.45); box-shadow:0 10px 35px rgba(0,0,0,.28); }
    .btn.primary { background:linear-gradient(135deg, rgba(104,244,216,.18), rgba(142,125,255,.18)); border-color:rgba(104,244,216,.32); }
    .micro { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; color:#8692a7; font-size:12px; }
    .micro span { padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.025); }

    .ai-orb { min-height:430px; position:relative; display:grid; place-items:center; }
    .orb { width:min(360px,74vw); aspect-ratio:1; position:relative; display:grid; place-items:center; }
    .orb::before, .orb::after { content:""; position:absolute; inset:10%; border-radius:50%; border:1px solid rgba(104,244,216,.25); animation:spin 16s linear infinite; }
    .orb::after { inset:18%; border-color:rgba(142,125,255,.25); animation-direction:reverse; animation-duration:11s; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .core { width:52%; height:52%; border-radius:50%; background:radial-gradient(circle at 40% 35%, #eaffff 0, #99fff0 10%, #4aeccf 22%, #4d45d8 58%, rgba(13,10,46,.9) 80%); box-shadow:0 0 100px rgba(104,244,216,.28), inset 0 0 80px rgba(255,255,255,.12); filter:saturate(120%); animation:float 5s ease-in-out infinite; }
